name: Build release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - name: Test
        run: cargo +nightly test

      - name: Build (smallest executable)
        env:
          RUSTFLAGS: -Zunstable-options -Cpanic=immediate-abort
        run: cargo +nightly build --release --target x86_64-pc-windows-msvc -Z build-std=std,panic_abort -Z build-std-features=optimize_for_size

      - name: Keep the executable as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriverStoreManager
          path: target/x86_64-pc-windows-msvc/release/DriverStoreManager.exe

      - name: Attach a zip with the executable and its SHA-256 to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $exe = "target/x86_64-pc-windows-msvc/release/DriverStoreManager.exe"
          $zip = "DriverStoreManager-$tag.zip"
          $sha = "DriverStoreManager-$tag.exe.sha256.txt"
          Compress-Archive -Path $exe -DestinationPath $zip
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path $sha -Value "$hash  DriverStoreManager.exe" -Encoding ascii
          gh release upload $tag $zip $sha --clobber
